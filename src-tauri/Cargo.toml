[package]
name = "klipt"
version = "0.6.0"
description = "Lightweight lossless game-clip trimmer"
authors = ["Yusuf"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "klipt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"

# In-process libav for the filmstrip decode path only: open the Clip once and
# seek-decode just the ~cols keyframes (vs the sidecar decoding every keyframe).
# Decode-only, dynamically linked against the LGPL shared build staged by
# scripts/fetch-libav.ps1 (needs FFMPEG_DIR + LIBCLANG_PATH at build time).
# default-features off -> link only avcodec/avformat/avutil + swscale (no
# avdevice/avfilter/swresample bindings; encode/mux stays in the GPL sidecar).
ffmpeg-the-third = { version = "5", default-features = false, features = [
    "codec",
    "format",
    "software-scaling",
] }
# Encode the assembled RGB filmstrip strip to JPEG in-process (keeps the FFI
# surface decode-only; no avcodec mjpeg encoder / muxer needed).
jpeg-encoder = "0.6"
notify = "8.2.0"

# Windows-only: tune the borderless window's DWM frame (subtle dark border
# instead of the bright default Win11 hairline). Pinned to the version already
# in the tree (pulled by tao) so it costs no extra compile.
[target.'cfg(windows)'.dependencies]
# Put the Clip file on the clipboard (CF_HDROP) for the right-click "Copy" action,
# so it pastes as a file into Explorer/Discord/email.
clipboard-win = "5"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"     # optimize for size; runtime work is in external ffmpeg
lto = true          # link-time optimization across crates
codegen-units = 1   # better optimization at the cost of build parallelism
strip = true        # drop debug symbols from the shipped binary
