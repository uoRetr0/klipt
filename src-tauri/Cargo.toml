[package]
name = "klipt"
version = "0.3.0"
description = "Lightweight lossless game-clip trimmer"
authors = ["Yusuf"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "klipt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"

# Windows-only: tune the borderless window's DWM frame (subtle dark border
# instead of the bright default Win11 hairline). Pinned to the version already
# in the tree (pulled by tao) so it costs no extra compile.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[profile.release]
opt-level = "s"     # optimize for size; runtime work is in external ffmpeg
lto = true          # link-time optimization across crates
codegen-units = 1   # better optimization at the cost of build parallelism
strip = true        # drop debug symbols from the shipped binary
