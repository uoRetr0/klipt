name: Release

# Builds the Windows installer and attaches it to a DRAFT GitHub release, so a
# human reviews and clicks publish. Trigger by pushing a version tag (v*) or
# running the workflow manually with a tag input.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.3.5). Must match tauri.conf.json version.'
        required: true

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Stage FFmpeg sidecar
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-ffmpeg.ps1

      # Stage the in-process libav (LGPL shared) so ffmpeg-sys-the-third links at
      # build time and the DLLs are present for tauri.conf bundle.resources to
      # ship next to the exe. Needs libclang (windows-latest ships LLVM; see
      # .cargo/config.toml LIBCLANG_PATH).
      - name: Stage libav (LGPL shared)
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-libav.ps1

      # tauri-action runs the tauri build (which runs beforeBuildCommand to build
      # the frontend), then creates/updates the draft release and uploads the
      # .msi + NSIS installer.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Klipt ${{ inputs.tag || github.ref_name }}
          releaseDraft: true
          prerelease: false

  linux:
    name: Linux packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Tauri v2 native deps (webkit2gtk 4.1, gtk, ayatana appindicator, rsvg,
      # xdo, patchelf for the AppImage) plus clang/libclang + llvm for the
      # ffmpeg-the-third bindgen step. The GStreamer runtime + dev packages are
      # required by linuxdeploy-plugin-gstreamer, which appimage's
      # bundleMediaFramework (tauri.linux.conf.json) turns on — without them
      # linuxdeploy exits immediately and the AppImage bundle fails.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf build-essential curl wget file libxdo-dev libssl-dev \
            libgtk-3-dev clang libclang-dev llvm-dev pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-gl

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Stage FFmpeg sidecar
        run: bash scripts/fetch-ffmpeg.sh

      # Stage the in-process libav (LGPL shared) so ffmpeg-sys-the-third links at
      # build time and the .so files are present for tauri.linux.conf.json
      # bundle.resources to ship next to the binary.
      - name: Stage libav (LGPL shared)
        run: bash scripts/fetch-libav.sh

      # .cargo/config.toml's LIBCLANG_PATH default is a Windows path; a real env
      # var wins over an un-forced [env] entry, so point bindgen at the distro's
      # libclang explicitly.
      - name: Point bindgen at libclang
        run: echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"

      # Same draft release as the Windows job (tauri-action finds it by tag and
      # appends assets): uploads the .deb and the AppImage.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Klipt ${{ inputs.tag || github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --bundles deb,appimage
