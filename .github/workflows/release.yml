name: Release

# Builds the Windows installer and attaches it to a DRAFT GitHub release, so a
# human reviews and clicks publish. Trigger by pushing a version tag (v*) or
# running the workflow manually with a tag input.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.3.5). Must match tauri.conf.json version.'
        required: true

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Stage FFmpeg sidecar
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-ffmpeg.ps1

      # tauri-action runs the tauri build (which runs beforeBuildCommand to build
      # the frontend), then creates/updates the draft release and uploads the
      # .msi + NSIS installer.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Klipt ${{ inputs.tag || github.ref_name }}
          releaseDraft: true
          prerelease: false
