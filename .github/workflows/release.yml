name: Release

# Builds the Linux installers (.deb, .rpm, AppImage) and attaches them to a
# DRAFT GitHub release, so a human reviews and clicks publish. Trigger by
# pushing a version tag (v*) or running the workflow manually with a tag input.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.3.1). Must match tauri.conf.json version.'
        required: true

jobs:
  linux:
    name: Linux bundles
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            libssl-dev \
            libxdo-dev \
            file wget curl

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Stage FFmpeg sidecar (Linux)
        run: bash scripts/fetch-ffmpeg.sh

      # tauri-action runs the tauri build (which runs beforeBuildCommand to build
      # the frontend), then creates/updates the draft release and uploads the
      # .deb / .rpm / AppImage bundles.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Klipt ${{ inputs.tag || github.ref_name }}
          releaseDraft: true
          prerelease: false
