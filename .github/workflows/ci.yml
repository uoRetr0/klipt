name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref so a force-push doesn't pile up builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (compile + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux toolchain: WebKitGTK + GTK + the tray/appindicator libs.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            libssl-dev \
            libxdo-dev \
            file wget curl

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Cache the cargo registry + target dir keyed on Cargo.lock.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The FFmpeg sidecar is gitignored; stage the pinned Linux build so the
      # Rust shell's externalBin resolves during compile.
      - name: Stage FFmpeg sidecar (Linux)
        run: bash scripts/fetch-ffmpeg.sh

      # Style + lint gate. fmt is whitespace-only so it runs first and fails fast;
      # clippy is gated at -D warnings to keep the tree warning-clean.
      - name: Rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Proves the Rust shell links on Linux (i.e. the #[cfg(windows)] DWM /
      # `windows`-crate code is correctly excluded). Bundling is done in release.yml.
      - name: Compile shell
        run: cargo build --manifest-path src-tauri/Cargo.toml

  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      # svelte-check still has a large pre-existing error baseline; surface the
      # svelte-check is now clean, so this is a hard gate — a new type error
      # fails CI rather than just printing a count.
      - name: Typecheck
        run: npm run check
