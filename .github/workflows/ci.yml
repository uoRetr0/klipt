name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref so a force-push doesn't pile up builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (compile + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Cache the cargo registry + target dir keyed on Cargo.lock.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The FFmpeg sidecar is gitignored; stage the pinned build so the Rust
      # shell's externalBin resolves during compile.
      - name: Stage FFmpeg sidecar
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-ffmpeg.ps1

      # Style + lint gate. fmt is whitespace-only so it runs first and fails fast;
      # clippy is gated at -D warnings to keep the tree warning-clean.
      - name: Rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Compile shell
        run: cargo build --manifest-path src-tauri/Cargo.toml

  frontend:
    name: Frontend (test + build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      # svelte-check still has a large pre-existing error baseline; surface the
      # svelte-check is now clean, so this is a hard gate — a new type error
      # fails CI rather than just printing a count.
      - name: Typecheck
        run: npm run check
